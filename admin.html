<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank – Admin</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{background:#f5f7fa;min-height:100vh;display:flex;justify-content:center;align-items:center;}
    .admin-wrapper{width:90%;max-width:600px;background:#fff;padding:2rem;border-radius:12px;
        box-shadow:0 4px 20px rgba(0,0,0,.08);}
    h1{color:#1e293b;margin-bottom:1.5rem;text-align:center;}
    .form-group{margin-bottom:1rem;}
    .form-group label{display:block;margin-bottom:.4rem;font-weight:500;color:#334155;}
    .form-group input,
    .form-group select{
        width:100%;padding:.75rem 1rem;border:1px solid #cbd5e1;
        border-radius:6px;font-size:1rem;transition:border-color .2s;
    }
    .form-group input:focus,
    .form-group select:focus{border-color:#2563eb;outline:none;}
    .update-btn{
        width:100%;background:#10b981;color:#fff;border:none;
        padding:.85rem;border-radius:6px;font-size:1rem;
        cursor:pointer;transition:background .2s;
    }
    .update-btn:hover{background:#059669;}
    .msg{margin-top:1rem;padding:.75rem;border-radius:6px;text-align:center;font-weight:500;}
    .msg.success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;}
    .msg.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
    table{width:100%;border-collapse:collapse;margin-top:1.5rem;}
    th,td{padding:.75rem 1rem;border:1px solid #e2e8f0;text-align:left;}
    th{background:#f1f5f9;}
    tr:hover td{background:#f8fafc;}
    @media(max-width:480px){
        .admin-wrapper{padding:1.5rem;}
    }
    /* Popup overlay (error) */
    .popup-overlay{
        position:fixed;inset:0;background:rgba(0,0,0,.5);
        display:flex;justify-content:center;align-items:center;
        z-index:1000;opacity:0;visibility:hidden;
        transition:opacity .3s ease,visibility .3s ease;
    }
    .popup-overlay.active{opacity:1;visibility:visible;}
    .popup-content{
        background:#fff;padding:2rem;border-radius:16px;
        text-align:center;width:90%;max-width:340px;
        box-shadow:0 10px 25px rgba(0,0,0,.15);
        transform:translateY(-20px);transition:transform .3s ease;
    }
    .popup-overlay.active .popup-content{transform:translateY(0);}
    .popup-icon{font-size:3rem;color:#ef4444;margin-bottom:1.5rem;}
    .popup-title{font-size:1.25rem;color:#1e293b;margin-bottom:1rem;}
    .popup-message{color:#64748b;margin-bottom:2rem;line-height:1.5;}
    .popup-btn{
        background:#dc2626;color:#fff;border:none;padding:.75rem 2rem;
        border-radius:8px;font-size:1rem;cursor:pointer;
        transition:background .2s ease;font-weight:500;
    }
    .popup-btn:hover{background:#b91c1c;}
</style>
</head>
<body>

<div class="admin-wrapper">
    <!-- Admin login form (shown first) -->
    <div id="loginForm">
        <h1>Admin Login</h1>
        <div class="form-group">
            <label for="adminUser">Username</label>
            <input type="text" id="adminUser" placeholder="admin" required>
        </div>
        <div class="form-group">
            <label for="adminPass">Password</label>
            <input type="password" id="adminPass" placeholder="123" required>
        </div>
        <button type="submit" class="update-btn" id="adminLoginBtn">Login</button>
    </div>

    <!-- Admin UI (hidden until login succeeds) -->
    <div id="adminUI" style="display:none;">
        <h1>Admin – Accounts Overview</h1>

        <!-- Balance change section -->
        <div class="form-group">
            <label for="userSelect">Select User</label>
            <select id="userSelect"></select>
        </div>
        <div class="form-group">
            <label for="newBal">New Balance (USD)</label>
            <input type="number" id="newBal" step="0.01" min="0" placeholder="e.g. 1250.50" required>
        </div>
        <button class="update-btn" id="changeBalBtn">Update Balance</button>
        <div id="adminMsg" class="msg"></div>

        <hr style="margin:2rem 0;">

        <!-- Accounts table -->
        <table id="accountsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Username</th>
                    <th>Balance (USD)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Error popup (wrong credentials) -->
<div class="popup-overlay" id="errorPopup">
    <div class="popup-content">
        <div class="popup-icon">⚠️</div>
        <h2 class="popup-title">Wrong credentials</h2>
        <p class="popup-message">Please check your username and password and try again.</p>
        <button class="popup-btn" id="errorOkay">Okay</button>
    </div>
</div>

<script>
    const ACCOUNTS_KEY = 'sbAccounts';
    const BALANCES_KEY = 'sbUserBalances';
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = '123';
    const MAX_ATTEMPTS = 3;

    let adminAttempts = 0;

    // ---------- Helper functions ----------
    function getAccounts(){
        const raw = localStorage.getItem(ACCOUNTS_KEY);
        if(!raw){
            const def = [{username:'Akhil',password:'0606',name:'Akhil',age:25}];
            localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(def));
            return def;
        }
        return JSON.parse(raw);
    }
    function saveAccounts(arr){ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(arr)); }
    function getBalances(){ return JSON.parse(localStorage.getItem(BALANCES_KEY) || '{}'); }
    function saveBalances(obj){ localStorage.setItem(BALANCES_KEY, JSON.stringify(obj)); }

    function showPopup(el){ el.classList.add('active'); }
    function hidePopup(el){ el.classList.remove('active'); }
    function showMsg(el, text, isSuccess){
        el.textContent = text;
        el.className = 'msg ' + (isSuccess ? 'success' : 'error');
    }

    // ---------- Render accounts (dropdown + table) ----------
    function renderAccounts(){
        const accounts = getAccounts();
        const balances = getBalances();

        const select = document.getElementById('userSelect');
        select.innerHTML = ''; // clear
        accounts.forEach(acc => {
            const opt = document.createElement('option');
            opt.value = acc.username;
            opt.textContent = `${acc.name} (${acc.username})`;
            select.appendChild(opt);
        });

        const tbody = document.querySelector('#accountsTable tbody');
        tbody.innerHTML = '';
        accounts.forEach(acc => {
            const row = document.createElement('tr');
            const bal = balances[acc.username] !== undefined ? balances[acc.username] : 0;
            row.innerHTML = `
                <td>${acc.name}</td>
                <td>${acc.age}</td>
                <td>${acc.username}</td>
                <td>$${bal.toFixed(2)}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // ---------- Admin login ----------
    const loginForm = document.getElementById('loginForm');
    const adminUI   = document.getElementById('adminUI');
    const adminLoginBtn = document.getElementById('adminLoginBtn');
    const errorPopup = document.getElementById('errorPopup');
    const errorOkay   = document.getElementById('errorOkay');

    adminLoginBtn.addEventListener('click', function(e){
        e.preventDefault();
        const user = document.getElementById('adminUser').value.trim();
        const pass = document.getElementById('adminPass').value;

        if(user===ADMIN_USER && pass===ADMIN_PASS){
            // Successful login
            loginForm.style.display = 'none';
            adminUI.style.display   = 'block';
            adminAttempts = 0; // reset counter
            renderAccounts();   // populate UI
        }else{
            adminAttempts++;
            if(adminAttempts >= MAX_ATTEMPTS){
                // Lockout after 3 tries
                loginForm.querySelectorAll('input,button').forEach(el=>el.disabled=true);
                showMsg(document.getElementById('adminMsg'), 
                        'Maximum attempts reached. Kindly login after sometime due to security reasons.',false);
            }else{
                showPopup(errorPopup);
            }
        }
    });

    // ---------- Error popup handling ----------
    errorOkay.addEventListener('click',()=>{
        hidePopup(errorPopup);
        // clear fields for next try
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
    });
    document.addEventListener('keydown',e=>{
        if(e.key==='Escape') hidePopup(errorPopup);
    });
    errorPopup.addEventListener('click',e=>{ if(e.target===errorPopup) hidePopup(errorPopup); });

    // ---------- Balance update ----------
    const changeBalBtn = document.getElementById('changeBalBtn');
    const newBalInput  = document.getElementById('newBal');
    const adminMsg     = document.getElementById('adminMsg');

    changeBalBtn.addEventListener('click',()=>{
        const selectedUser = document.getElementById('userSelect').value;
        const valStr       = newBalInput.value.trim();
        if(selectedUser === ''){
            showMsg(adminMsg,'Please select a user.',false);
            return;
        }
        if(valStr === ''){
            showMsg(adminMsg,'Please enter a balance.',false);
            return;
        }
        const val = parseFloat(valStr);
        if(isNaN(val) || val < 0){
            showMsg(adminMsg,'Please enter a valid non‑negative number.',false);
            return;
        }
        // Update balance
        const balances = getBalances();
        balances[selectedUser] = val;
        saveBalances(balances);
        showMsg(adminMsg,'Balance updated successfully!',true);
        newBalInput.value = '';
        // Refresh table to show new balance
        renderAccounts();
    });
</script>
</body>
</html>
