<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank – Home</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{background:#f5f7fa;min-height:100vh;display:flex;justify-content:center;align-items:center;}
    .bank-container{text-align:center;padding:2rem;background:#fff;border-radius:12px;
        box-shadow:0 4px 20px rgba(0,0,0,.08);width:90%;max-width:420px;}
    .bank-logo{font-size:2.5rem;color:#2563eb;margin-bottom:1.5rem;}
    h1{color:#1e293b;margin-bottom:1rem;}
    p{color:#64748b;line-height:1.6;margin-bottom:1.5rem;}
    #authBtn{
        position:fixed;top:1rem;right:1rem;
        padding:.5rem 1rem;border:none;border-radius:6px;
        font-size:1rem;cursor:pointer;transition:background .2s;
        color:#fff;
    }
    #authBtn.sign-in{background:#2563eb;}
    #authBtn.sign-in:hover{background:#1d4ed8;}
    #authBtn.log-out{background:#dc2626;}
    #authBtn.log-out:hover{background:#b91c1c;}
    .popup-overlay{
        position:fixed;inset:0;background:rgba(0,0,0,.5);
        display:flex;justify-content:center;align-items:center;
        z-index:1000;opacity:0;visibility:hidden;
        transition:opacity .3s ease,visibility .3s ease;
    }
    .popup-overlay.active{opacity:1;visibility:visible;}
    .popup-content{
        background:#fff;padding:2.5rem;border-radius:16px;
        text-align:center;width:90%;max-width:340px;
        box-shadow:0 10px 25px rgba(0,0,0,.15);
        transform:translateY(-20px);transition:transform .3s ease;
    }
    .popup-overlay.active .popup-content{transform:translateY(0);}
    .popup-icon{font-size:3rem;color:#10b981;margin-bottom:1.5rem;}
    .popup-title{font-size:1.25rem;color:#1e293b;margin-bottom:1rem;}
    .popup-message{color:#64748b;margin-bottom:2rem;line-height:1.5;}
    .popup-btn{
        background:#2563eb;color:#fff;border:none;padding:.75rem 2rem;
        border-radius:8px;font-size:1rem;cursor:pointer;
        transition:background .2s ease;font-weight:500;
    }
    .popup-btn:hover{background:#1d4ed8;}
    @media(max-width:480px){
        .bank-container{padding:1.5rem;}
        .popup-content{padding:2rem;}
    }
</style>
</head>
<body>

<button id="authBtn" class="sign-in">Sign In</button>

<div class="bank-container">
    <div class="bank-logo">🏦</div>
    <h1>SecureBank</h1>
    <p>Your trusted financial partner</p>
    <p>Dummy banking interface for demonstration purposes</p>
</div>

<div class="popup-overlay" id="welcomePopup">
    <div class="popup-content">
        <div class="popup-icon">👋</div>
        <h2 class="popup-title">Welcome back, customer!</h2>
        <p class="popup-message">We're glad to see you again. How can we assist you today?</p>
        <button class="popup-btn" id="thanksBtn">Thanks</button>
    </div>
</div>

<script>
    const STORAGE_KEY = 'sbLoggedIn';
    function isLoggedIn(){ return localStorage.getItem(STORAGE_KEY) === 'true'; }
    function setLoggedIn(v){ localStorage.setItem(STORAGE_KEY, v); }
    function clearLogin(){ localStorage.removeItem(STORAGE_KEY); }

    function showPopup(el){ el.classList.add('active'); }
    function hidePopup(el){ el.classList.remove('active'); }

    document.addEventListener('DOMContentLoaded',()=>{
        const welcomePopup = document.getElementById('welcomePopup');
        const thanksBtn    = document.getElementById('thanksBtn');
        const authBtn      = document.getElementById('authBtn');

        setTimeout(()=>showPopup(welcomePopup),300);
        thanksBtn.addEventListener('click',()=>{ hidePopup(welcomePopup); });

        document.addEventListener('keydown',e=>{
            if(e.key==='Escape'){
                [welcomePopup].forEach(p=>hidePopup(p));
            }
        });
        welcomePopup.addEventListener('click',e=>{ if(e.target===welcomePopup) hidePopup(welcomePopup); });

        function updateAuthBtn(){
            if(isLoggedIn()){
                authBtn.textContent = 'Log Out';
                authBtn.className = 'log-out';
            }else{
                authBtn.textContent = 'Sign In';
                authBtn.className = 'sign-in';
            }
        }
        updateAuthBtn();

        authBtn.addEventListener('click',()=>{
            if(isLoggedIn()){
                clearLogin();
                updateAuthBtn();
                window.location.href = 'dashboard.html';
            }else{
                window.location.href = 'signin.html';
            }
        });

        if(isLoggedIn()){
            window.location.href = 'dashboard.html';
        }
    });
</script>
</body>
</html>
