<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank – Create Account</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{background:#f5f7fa;min-height:100vh;display:flex;justify-content:center;align-items:center;}
    .form-wrapper{width:90%;max-width:420px;background:#fff;padding:2rem;border-radius:12px;
        box-shadow:0 4px 20px rgba(0,0,0,.08);}
    h1{color:#1e293b;margin-bottom:1.5rem;text-align:center;}
    .form-group{margin-bottom:1.2rem;}
    .form-group label{display:block;margin-bottom:.4rem;font-weight:500;color:#334155;}
    .form-group input{
        width:100%;padding:.75rem 1rem;border:1px solid #cbd5e1;
        border-radius:6px;font-size:1rem;transition:border-color .2s;
    }
    .form-group input:focus{border-color:#2563eb;outline:none;}
    .go-btn{
        width:100%;background:#10b981;color:#fff;border:none;
        padding:.85rem;border-radius:6px;font-size:1rem;
        cursor:pointer;transition:background .2s;
    }
    .go-btn:hover{background:#059669;}
    .msg{margin-top:1rem;padding:.75rem;border-radius:6px;text-align:center;font-weight:500;}
    .msg.success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;}
    .msg.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
    @media(max-width:480px){
        .form-wrapper{padding:1.5rem;}
    }
</style>
</head>
<body>

<div class="form-wrapper">
    <h1>Create New Account</h1>
    <form id="regForm" autocomplete="off">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="e.g. John Doe" required>
        </div>
        <div class="form-group">
            <label for="age">Age (must be > 18)</label>
            <input type="number" id="age" min="0" placeholder="e.g. 22" required>
        </div>
        <div class="form-group">
            <label for="newUser">Username</label>
            <input type="text" id="newUser" placeholder="choose a username" required>
        </div>
        <div class="form-group">
            <label for="newPass">Password</label>
            <input type="password" id="newPass" placeholder="choose a password" required>
        </div>
        <button type="submit" class="go-btn">Go Ahead</button>
    </form>
    <div id="regMsg" class="msg"></div>
</div>

<script>
    const ACCOUNTS_KEY = 'sbAccounts';
    const BALANCES_KEY = 'sbUserBalances';
    const LOGGED_KEY   = 'sbLoggedIn';
    const CURRENT_KEY  = 'sbCurrentUser';

    // Helper to get/save data
    function getAccounts(){
        const raw = localStorage.getItem(ACCOUNTS_KEY);
        if(!raw){
            const def = [{username:'Akhil',password:'0606',name:'Akhil',age:25}];
            localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(def));
            return def;
        }
        return JSON.parse(raw);
    }
    function saveAccounts(arr){ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(arr)); }
    function getBalances(){ return JSON.parse(localStorage.getItem(BALANCES_KEY)||'{}'); }
    function saveBalances(obj){ localStorage.setItem(BALANCES_KEY, JSON.stringify(obj)); }
    function showMsg(el, text, isSuccess){
        el.textContent = text;
        el.className = 'msg ' + (isSuccess ? 'success' : 'error');
    }

    const form = document.getElementById('regForm');
    const msg  = document.getElementById('regMsg');

    form.addEventListener('submit',e=>{
        e.preventDefault();
        const name   = document.getElementById('fullName').value.trim();
        const age    = parseInt(document.getElementById('age').value,10);
        const user   = document.getElementById('newUser').value.trim();
        const pass   = document.getElementById('newPass').value;

        // Basic validation
        if(!name || !user || !pass || isNaN(age)){
            showMsg(msg,'Please fill in all fields correctly.',false);
            return;
        }
        if(age <= 18){
            showMsg(msg,'You must be older than 18 to create an account.',false);
            return;
        }
        const accounts = getAccounts();
        if(accounts.some(a=>a.username===user)){
            showMsg(msg,'Username already taken. Choose another.',false);
            return;
        }

        // Create account
        accounts.push({username:user,password:pass,name:name,age:age});
        saveAccounts(accounts);

        // Ensure balance entry exists (default 0)
        const bal = getBalances();
        if(!(user in bal)){
            bal[user] = 0;
            saveBalances(bal);
        }

        // Log the new user in
        localStorage.setItem(LOGGED_KEY,'true');
        localStorage.setItem(CURRENT_KEY, user);
        window.location.href = 'dashboard.html';
    });
</script>
</body>
</html>
