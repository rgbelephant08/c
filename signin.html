<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank – Sign In</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{background:#f5f7fa;min-height:100vh;display:flex;justify-content:center;align-items:center;}
    .form-wrapper{width:90%;max-width:420px;background:#fff;padding:2rem;border-radius:12px;
        box-shadow:0 4px 20px rgba(0,0,0,.08);}
    h1{color:#1e293b;margin-bottom:1rem;text-align:center;}
    p{color:#64748b;line-height:1.6;margin-bottom:1.5rem;text-align:center;}
    #loginForm{text-align:left;}
    .form-group{margin-bottom:1.2rem;}
    .form-group label{display:block;margin-bottom:.4rem;font-weight:500;color:#334155;}
    .form-group input{
        width:100%;padding:.75rem 1rem;border:1px solid #cbd5e1;
        border-radius:6px;font-size:1rem;transition:border-color .2s;
    }
    .form-group input:focus{border-color:#2563eb;outline:none;}
    .login-btn{
        width:100%;background:#10b981;color:#fff;border:none;
        padding:.85rem;border-radius:6px;font-size:1rem;
        cursor:pointer;transition:background .2s;
    }
    .login-btn:hover{background:#059669;}
    .msg{margin-top:1rem;padding:.75rem;border-radius:6px;text-align:center;font-weight:500;}
    .msg.success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;}
    .msg.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
    .create-link{
        margin-top:1rem;
        display:inline-block;
        color:#2563eb;
        text-decoration:none;
        font-weight:500;
    }
    .create-link:hover{text-decoration:underline;}
    /* Popup overlay (error) */
    .popup-overlay{
        position:fixed;inset:0;background:rgba(0,0,0,.5);
        display:flex;justify-content:center;align-items:center;
        z-index:1000;opacity:0;visibility:hidden;
        transition:opacity .3s ease,visibility .3s ease;
    }
    .popup-overlay.active{opacity:1;visibility:visible;}
    .popup-content{
        background:#fff;padding:2rem;border-radius:16px;
        text-align:center;width:90%;max-width:340px;
        box-shadow:0 10px 25px rgba(0,0,0,.15);
        transform:translateY(-20px);transition:transform .3s ease;
    }
    .popup-overlay.active .popup-content{transform:translateY(0);}
    .popup-icon{font-size:3rem;color:#ef4444;margin-bottom:1.5rem;}
    .popup-title{font-size:1.25rem;color:#1e293b;margin-bottom:1rem;}
    .popup-message{color:#64748b;margin-bottom:2rem;line-height:1.5;}
    .popup-btn{
        background:#dc2626;color:#fff;border:none;padding:.75rem 2rem;
        border-radius:8px;font-size:1rem;cursor:pointer;
        transition:background .2s ease;font-weight:500;
    }
    .popup-btn:hover{background:#b91c1c;}
    @media(max-width:480px){
        .form-wrapper{padding:1.5rem;}
    }
</style>
</head>
<body>

<div class="form-wrapper">
    <form id="loginForm" autocomplete="off">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" class="login-btn">Sign In</button>
    </form>
    <div id="formMsg" class="msg"></div>
    <p>Don’t have an account? <a href="create_account.html" class="create-link">Create new account</a></p>
</div>

<!-- Error Popup (wrong credentials) -->
<div class="popup-overlay" id="errorPopup">
    <div class="popup-content">
        <div class="popup-icon">⚠️</div>
        <h2 class="popup-title">Wrong credentials</h2>
        <p class="popup-message">Please check your username and password and try again.</p>
        <button class="popup-btn" id="errorOkay">Okay</button>
    </div>
</div>

<script>
    // ---------- Storage keys ----------
    const ACCOUNTS_KEY = 'sbAccounts';
    const BALANCES_KEY = 'sbUserBalances';
    const LOGGED_KEY   = 'sbLoggedIn';
    const CURRENT_KEY  = 'sbCurrentUser';
    const MAX_ATTEMPTS = 3;

    // ---------- Helpers ----------
    function getAccounts(){
        const raw = localStorage.getItem(ACCOUNTS_KEY);
        if(!raw){
            // default Akhil account
            const def = [{username:'Akhil',password:'0606',name:'Akhil',age:25}];
            localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(def));
            return def;
        }
        return JSON.parse(raw);
    }
    function saveAccounts(arr){ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(arr)); }
    function getBalances(){
        const raw = localStorage.getItem(BALANCES_KEY);
        return raw ? JSON.parse(raw) : {};
    }
    function saveBalances(obj){ localStorage.setItem(BALANCES_KEY, JSON.stringify(obj)); }
    function showPopup(el){ el.classList.add('active'); }
    function hidePopup(el){ el.classList.remove('active'); }
    function showMsg(el, text, isSuccess){
        el.textContent = text;
        el.className = 'msg ' + (isSuccess ? 'success' : 'error');
    }

    // ---------- State ----------
    let attempts = 0;

    // ---------- Form handling ----------
    const form = document.getElementById('loginForm');
    const formMsg = document.getElementById('formMsg');
    const errorPopup = document.getElementById('errorPopup');
    const errorOkay = document.getElementById('errorOkay');

    form.addEventListener('submit',e=>{
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;

        const accounts = getAccounts();
        const acc = accounts.find(a=>a.username===user && a.password===pass);
        if(acc){
            // successful login
            localStorage.setItem(LOGGED_KEY,'true');
            localStorage.setItem(CURRENT_KEY, user);
            window.location.href = 'dashboard.html';
        }else{
            attempts++;
            showMsg(formMsg, `Invalid credentials. Attempt ${attempts}/${MAX_ATTEMPTS}`, false);
            if(attempts >= MAX_ATTEMPTS){
                // lockout
                form.querySelectorAll('input,button').forEach(el=>el.disabled=true);
                showMsg(formMsg, 'Maximum attempts reached. Kindly login after sometime due to security reasons.', false);
            }else{
                showPopup(errorPopup);
            }
        }
    });

    errorOkay.addEventListener('click',()=>{
        hidePopup(errorPopup);
        form.reset();
    });
    document.addEventListener('keydown',e=>{
        if(e.key==='Escape') hidePopup(errorPopup);
    });
    errorPopup.addEventListener('click',e=>{ if(e.target===errorPopup) hidePopup(errorPopup); });
</script>
</body>
</html>
