<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank – Sign In</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{background:#f5f7fa;min-height:100vh;display:flex;justify-content:center;align-items:center;}
    .form-wrapper{width:90%;max-width:420px;background:#fff;padding:2rem;border-radius:12px;
        box-shadow:0 4px 20px rgba(0,0,0,.08);}
    h1{color:#1e293b;margin-bottom:1rem;text-align:center;}
    p{color:#64748b;line-height:1.6;margin-bottom:1.5rem;text-align:center;}

    /* ----- Login form ----- */
    #loginForm{text-align:left;}
    .form-group{margin-bottom:1.2rem;}
    .form-group label{display:block;margin-bottom:.4rem;font-weight:500;color:#334155;}
    .form-group input{
        width:100%;padding:.75rem 1rem;border:1px solid #cbd5e1;
        border-radius:6px;font-size:1rem;transition:border-color .2s;
    }
    .form-group input:focus{border-color:#2563eb;outline:none;}
    .login-btn{
        width:100%;background:#10b981;color:#fff;border:none;
        padding:.85rem;border-radius:6px;font-size:1rem;
        cursor:pointer;transition:background .2s;
    }
    .login-btn:hover{background:#059669;}
    .msg{margin-top:1rem;padding:.75rem;border-radius:6px;text-align:center;font-weight:500;}
    .msg.success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;}
    .msg.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}

    /* ----- Popup overlay (error) ----- */
    .popup-overlay{
        position:fixed;inset:0;background:rgba(0,0,0,.5);
        display:flex;justify-content:center;align-items:center;
        z-index:1000;opacity:0;visibility:hidden;
        transition:opacity .3s ease,visibility .3s ease;
    }
    .popup-overlay.active{opacity:1;visibility:visible;}
    .popup-content{
        background:#fff;padding:2rem;border-radius:16px;
        text-align:center;width:90%;max-width:340px;
        box-shadow:0 10px 25px rgba(0,0,0,.15);
        transform:translateY(-20px);transition:transform .3s ease;
    }
    .popup-overlay.active .popup-content{transform:translateY(0);}
    .popup-icon{font-size:3rem;color:#ef4444;margin-bottom:1.5rem;}
    .popup-title{font-size:1.25rem;color:#1e293b;margin-bottom:1rem;}
    .popup-message{color:#64748b;margin-bottom:2rem;line-height:1.5;}
    .popup-btn{
        background:#dc2626;color:#fff;border:none;padding:.75rem 2rem;
        border-radius:8px;font-size:1rem;cursor:pointer;
        transition:background .2s ease;font-weight:500;
    }
    .popup-btn:hover{background:#b91c1c;}
</style>
</head>
<body>

<div class="form-wrapper">
    <!-- Login form (visible immediately) -->
    <form id="loginForm" autocomplete="off">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" class="login-btn">Sign In</button>
    </form>
    <div id="formMsg" class="msg"></div>
</div>

<!-- Error Popup (wrong credentials) -->
<div class="popup-overlay" id="errorPopup">
    <div class="popup-content">
        <div class="popup-icon">⚠️</div>
        <h2 class="popup-title">Wrong credentials</h2>
        <p class="popup-message">Please check your username and password and try again.</p>
        <button class="popup-btn" id="errorOkay">Okay</button>
    </div>
</div>

<script>
    // ---------- Constants ----------
    const MAX_ATTEMPTS = 3;
    const CORRECT_USER = 'Akhil';
    const CORRECT_PASS = '0606';
    const STORAGE_KEY  = 'sbLoggedIn';

    // ---------- State ----------
    let attempts = 0;

    // ---------- Helpers ----------
    function showPopup(el){ el.classList.add('active'); }
    function hidePopup(el){ el.classList.remove('active'); }

    // ---------- Form handling ----------
    const form = document.getElementById('loginForm');
    const formMsg = document.getElementById('formMsg');
    const errorPopup = document.getElementById('errorPopup');
    const errorOkay = document.getElementById('errorOkay');

    form.addEventListener('submit',e=>{
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;

        if(user===CORRECT_USER && pass===CORRECT_PASS){
            // Success → store login state and go back to home
            localStorage.setItem(STORAGE_KEY,'true');
            window.location.href = 'index.html';
        }else{
            attempts++;
            formMsg.textContent = `Invalid credentials. Attempt ${attempts}/${MAX_ATTEMPTS}`;
            formMsg.className = 'msg error';

            if(attempts >= MAX_ATTEMPTS){
                // Lockout
                form.querySelectorAll('input,button').forEach(el=>el.disabled=true);
                formMsg.textContent = 'Maximum attempts reached. Kindly login after sometime due to security reasons.';
            }else{
                showPopup(errorPopup);
            }
        }
    });

    errorOkay.addEventListener('click',()=>{
        hidePopup(errorPopup);
        form.reset(); // clear fields for next try
    });

    // Optional: close error popup on ESC or clicking outside
    document.addEventListener('keydown',e=>{
        if(e.key==='Escape') hidePopup(errorPopup);
    });
    errorPopup.addEventListener('click',e=>{ if(e.target===errorPopup) hidePopup(errorPopup); });
</script>
</body>
</html>
