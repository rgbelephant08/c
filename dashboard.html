<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank – Dashboard</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{background:#f5f7fa;min-height:100vh;display:flex;flex-direction:column;}
    header{
        display:flex;justify-content:space-between;align-items:center;
        padding:1rem 2rem;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);
    }
    .user-info{
        display:flex;align-items:center;gap:1rem;
        font-size:1.1rem;color:#1e293b;
    }
    .user-info span{font-weight:600;}
    #logoutBtn{
        background:#dc2626;color:#fff;border:none;
        padding:.5rem 1rem;border-radius:6px;font-size:1rem;
        cursor:pointer;transition:background .2s;
    }
    #logoutBtn:hover{background:#b91c1c;}
    main{
        flex:1;display:flex;justify-content:center;align-items:center;
        text-align:center;color:#64748b;
    }
    main p{font-size:1.2rem;}
    .hint{margin-top:1rem;font-size:.9rem;color:#6b7280;}
</style>
</head>
<body>

<header>
    <div class="user-info">
        <span>Welcome, </span><span id="userName"></span>
        <span>| Balance: </span><span id="userBalance">$0.00</span>
    </div>
    <button id="logoutBtn">Log Out</button>
</header>

<main>
    <p>This is your dashboard. You can add more banking features here.</p>
    <p class="hint">(Balance can be changed via the admin page.)</p>
</main>

<script>
    // Storage keys used throughout the demo
    const LOGGED_KEY   = 'sbLoggedIn';
    const CURRENT_KEY  = 'sbCurrentUser';
    const BALANCES_KEY = 'sbUserBalances';

    // Helper functions
    function isLoggedIn(){ return localStorage.getItem(LOGGED_KEY) === 'true'; }
    function clearLogin(){
        localStorage.removeItem(LOGGED_KEY);
        localStorage.removeItem(CURRENT_KEY);
    }

    // Run after the DOM is ready
    document.addEventListener('DOMContentLoaded', () => {
        // If the user isn’t logged in, send them home
        if (!isLoggedIn()) {
            window.location.href = 'home.html';
            return;
        }

        // Populate welcome info
        const username = localStorage.getItem(CURRENT_KEY);
        const balances = JSON.parse(localStorage.getItem(BALANCES_KEY) || '{}');
        const balance  = typeof balances[username] === 'number' ? balances[username] : 0;

        document.getElementById('userName').textContent = username;
        document.getElementById('userBalance').textContent = `$${balance.toFixed(2)}`;

        // Log‑out button handler
        const logoutBtn = document.getElementById('logoutBtn');
        logoutBtn.addEventListener('click', () => {
            clearLogin();               // remove login flag & current user
            window.location.href = 'home.html';
        });
    });
</script>
</body>
</html>
