<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureBank – Dashboard</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{background:#f5f7fa;min-height:100vh;display:flex;flex-direction:column;}
    header{
        display:flex;justify-content:space-between;align-items:center;
        padding:1rem 2rem;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);
    }
    .user-info{
        display:flex;align-items:center;gap:1rem;
        font-size:1.1rem;color:#1e293b;
    }
    .user-info span{font-weight:600;}
    /* Logout button – same red style as before */
    #logoutBtn{
        background:#dc2626;color:#fff;border:none;
        padding:.5rem 1rem;border-radius:6px;font-size:1rem;
        cursor:pointer;transition:background .2s;
    }
    #logoutBtn:hover{background:#b91c1c;}

    main{
        flex:1;display:flex;justify-content:center;align-items:center;
        text-align:center;color:#64748b;
    }
    main p{font-size:1.2rem;}
</style>
</head>
<body>

<header>
    <div class="user-info">
        <span>Welcome, </span><span id="userName">Akhil</span>
        <span>| Balance: </span><span id="userBalance">$0</span>
    </div>
    <button id="logoutBtn">Log Out</button>
</header>

<main>
    <p>This is your dashboard. You can add more banking features here.</p>
</main>

<script>
    // ---------- Helpers ----------
    const STORAGE_KEY = 'sbLoggedIn';
    function isLoggedIn(){ return localStorage.getItem(STORAGE_KEY) === 'true'; }
    function clearLogin(){ localStorage.removeItem(STORAGE_KEY); }

    // If for some reason the user lands here without being logged in, send them back
    if(!isLoggedIn()){
        window.location.href = 'index.html';
    }

    // Logout button
    document.getElementById('logoutBtn').addEventListener('click',()=>{
        clearLogin();
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
